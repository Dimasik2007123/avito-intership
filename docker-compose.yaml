version: "3.9"

services:
  mongo:
    image: mongo:7
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

  ollama:
    image: ollama/ollama:latest
    ports:
      - "${OLLAMA_PORT}:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - app-network
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        server_pid=$$!
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull ${OLLAMA_MODEL}
        wait "$$server_pid"

  item-service:
    build: ./item-service
    ports:
      - "${ITEM_SERVICE_PORT}:${ITEM_SERVICE_PORT}"
    environment:
      - PORT=${ITEM_SERVICE_PORT}
      - MONGODB_URI=${MONGODB_URI}
    depends_on:
      - mongo
    networks:
      - app-network

  ai-service:
    build: ./ai-service
    ports:
      - "${AI_SERVICE_PORT}:${AI_SERVICE_PORT}"
    environment:
      - PORT=${AI_SERVICE_PORT}
      - OLLAMA_URL=${OLLAMA_URL}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
    depends_on:
      - ollama
    networks:
      - app-network

  gateway:
    build: ./gateway
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    environment:
      - PORT=${GATEWAY_PORT}
      - ITEM_SERVICE_URL=${ITEM_SERVICE_URL}
      - AI_SERVICE_URL=${AI_SERVICE_URL}
    depends_on:
      - item-service
      - ai-service
    networks:
      - app-network

  client:
    build: ./client
    ports:
      - "${FRONTEND_PORT}:3000"
    environment:
      - DOCKER_ENV=true
      - VITE_API_URL=http://gateway:8080
    depends_on:
      - gateway
    networks:
      - app-network

volumes:
  mongo-data:
  ollama_data:

networks:
  app-network:
    driver: bridge
